name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          ACE22B: ${{ secrets.ACE22B }}
          B11495: ${{ secrets.B11495 }}
        run: |
          python3 -c "
          import pathlib, sys, os
          env_a = os.environ.get('ACE22B', '')
          env_b = os.environ.get('B11495', '')
          doc = pathlib.Path('index.html')
          body = doc.read_text(encoding='utf-8')
          result = body
          if env_a:
              result = result.replace('<!-- 0c3aa6b3d6bedefa6c573057589d4bb4ab46e3ac60 -->', env_a)
          if env_b:
              result = result.replace('<!-- 1e49549abd217d03d52a02697c9306dcd52f -->', env_b)
          if result == body and (env_a or env_b):
              sys.exit(1)
          if result != body:
              doc.write_text(result, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
